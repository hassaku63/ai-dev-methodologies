name: knowledge review

# Monthly report of the catalog entries that may have gone stale (ADR-0011,
# docs/dev/knowledge-review.md). It depends on the date and the network, so it is
# not part of `make check`. A pull request that changes the catalog, the script
# or this file runs the report without touching any issue.
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/knowledge-staleness.py
      - plugins/knowledge/catalog/**
      - .github/workflows/knowledge-review.yml

permissions:
  contents: read

jobs:
  report:
    name: knowledge staleness report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          python3 scripts/knowledge-staleness.py > report.md || status=$?
          # In the log as well as the summary, so the report can be read from the job log.
          tee -a "$GITHUB_STEP_SUMMARY" < report.md
          # 3 means "there is something to review"; anything else is a failure of the script.
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then exit "$status"; fi
          if [ "$status" -eq 3 ]; then echo "findings=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open or update the issue
        if: steps.report.outputs.findings == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create knowledge-review --color BFD4F2 \
            --description "確かめ直す知識の一覧（月次の報告）" 2>/dev/null || true
          number=$(gh issue list --label knowledge-review --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
          else
            gh issue create --title "知識の点検: 確かめ直す項目がある" --label knowledge-review --body-file report.md
          fi
